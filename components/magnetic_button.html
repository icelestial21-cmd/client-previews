<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Magnetic Kinetic Button — Sovereign Component</title>
  <style>
    :root {
      --bg: #07090E;
      --gold: #D4AF37;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg);
      color: #FFFFFF;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3rem;
    }

    .magnetic-area {
      display: inline-flex;
      padding: 40px;
      cursor: pointer;
    }

    .magnetic-btn {
      position: relative;
      padding: 1.25rem 2.75rem;
      border-radius: 999px;
      font-size: 1rem;
      font-weight: 600;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: #07090E;
      background: linear-gradient(135deg, #F5D77F 0%, #D4AF37 100%);
      border: none;
      box-shadow: 0 10px 30px -5px rgba(212, 175, 55, 0.4),
                  0 0 0 1px rgba(255, 255, 255, 0.2) inset;
      cursor: pointer;
      will-change: transform;
      transition: box-shadow 0.3s ease;
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .magnetic-btn:hover {
      box-shadow: 0 15px 40px -5px rgba(212, 175, 55, 0.6),
                  0 0 30px rgba(212, 175, 55, 0.5);
    }

    .magnetic-btn span {
      display: inline-block;
      will-change: transform;
    }

    .magnetic-btn-outline {
      background: rgba(255, 255, 255, 0.04);
      color: #FFFFFF;
      border: 1px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.6);
    }

    .magnetic-btn-outline:hover {
      background: rgba(255, 255, 255, 0.08);
      border-color: rgba(255, 255, 255, 0.35);
      box-shadow: 0 15px 40px -5px rgba(255, 255, 255, 0.15);
    }

    .note {
      color: #64748B;
      font-size: 0.85rem;
    }
  </style>
</head>
<body>

  <div style="display: flex; gap: 2rem;">
    <div class="magnetic-area">
      <button class="magnetic-btn">
        <span class="btn-text">Initialize Pipeline</span>
        <span class="btn-icon">&rarr;</span>
      </button>
    </div>

    <div class="magnetic-area">
      <button class="magnetic-btn magnetic-btn-outline">
        <span class="btn-text">Explore Vault</span>
        <span class="btn-icon">&#x2726;</span>
      </button>
    </div>
  </div>

  <div class="note">Hover near button perimeter to test gravitational magnetic pull</div>

  <script>
    document.querySelectorAll('.magnetic-area').forEach(area => {
      const btn = area.querySelector('.magnetic-btn');
      const text = btn.querySelector('.btn-text');
      const icon = btn.querySelector('.btn-icon');

      let currentX = 0;
      let currentY = 0;
      let targetX = 0;
      let targetY = 0;

      function render() {
        currentX += (targetX - currentX) * 0.15;
        currentY += (targetY - currentY) * 0.15;

        btn.style.transform = `translate3d(${currentX}px, ${currentY}px, 0)`;
        text.style.transform = `translate3d(${currentX * 0.25}px, ${currentY * 0.25}px, 0)`;
        icon.style.transform = `translate3d(${currentX * 0.4}px, ${currentY * 0.4}px, 0)`;

        requestAnimationFrame(render);
      }
      render();

      area.addEventListener('pointermove', (e) => {
        const rect = area.getBoundingClientRect();
        const centerX = rect.left + rect.width / 2;
        const centerY = rect.top + rect.height / 2;

        const distanceX = e.clientX - centerX;
        const distanceY = e.clientY - centerY;

        // Attraction pull strength (max 28px offset)
        targetX = distanceX * 0.45;
        targetY = distanceY * 0.45;
      });

      area.addEventListener('pointerleave', () => {
        targetX = 0;
        targetY = 0;
      });
    });
  </script>
</body>
</html>
