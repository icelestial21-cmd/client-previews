<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kinetic Text Ring — Sovereign Component</title>
  <style>
    :root {
      --bg: #07090E;
      --gold: #D4AF37;
      --text: #F8FAFC;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      user-select: none;
    }

    .container {
      position: relative;
      width: 460px;
      height: 460px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Core Orb inside the ring */
    .center-orb {
      position: absolute;
      width: 140px;
      height: 140px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #2A324B 0%, #10141E 60%, #080A10 100%);
      box-shadow: 0 0 50px rgba(0, 0, 0, 0.9),
                  inset 0 1px 2px rgba(255, 255, 255, 0.25),
                  0 0 40px rgba(212, 175, 55, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 2;
      transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.4s ease;
    }

    .center-orb:hover {
      transform: scale(1.08);
      box-shadow: 0 0 60px rgba(212, 175, 55, 0.35);
      border-color: rgba(212, 175, 55, 0.4);
    }

    .center-symbol {
      font-size: 2rem;
      color: var(--gold);
      line-height: 1;
    }

    .center-label {
      font-size: 0.65rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: #94A3B8;
      margin-top: 0.4rem;
    }

    /* SVG Kinetic Ring */
    svg.text-ring-svg {
      position: absolute;
      width: 100%;
      height: 100%;
      z-index: 1;
      overflow: visible;
      will-change: transform;
    }

    textPath {
      fill: #CBD5E1;
      font-size: 13.5px;
      font-weight: 600;
      letter-spacing: 0.24em;
      text-transform: uppercase;
      transition: fill 0.3s ease;
    }

    .container:hover textPath {
      fill: #FFFFFF;
    }

    /* Guidance Label */
    .caption {
      margin-top: 2rem;
      font-size: 0.85rem;
      color: #64748B;
      letter-spacing: 0.05em;
    }
  </style>
</head>
<body>

  <div class="container" id="ringContainer">
    <div class="center-orb">
      <div class="center-symbol">&#x2726;</div>
      <div class="center-label">Moradin</div>
    </div>

    <svg class="text-ring-svg" id="ringSvg" viewBox="0 0 500 500">
      <defs>
        <path id="circlePath" d="M 250, 250 m -185, 0 a 185,185 0 1,1 370,0 a 185,185 0 1,1 -370,0" fill="none" />
      </defs>
      <text>
        <textPath href="#circlePath" startOffset="0%">
          SOVEREIGN ENGINEERING &bull; OBSIDIAN NOIR ARCHITECTURE &bull; ZERO RENT CAPABILITY &bull; FORGEMASTER PROTOCOL &bull;
        </textPath>
      </text>
    </svg>
  </div>

  <div class="caption">Move pointer or drag to alter velocity and kinetic spin</div>

  <script>
    (function() {
      const ringSvg = document.getElementById('ringSvg');
      const container = document.getElementById('ringContainer');

      let currentRotation = 0;
      let targetVelocity = 0.25; // Base passive RPM
      let currentVelocity = targetVelocity;
      let lastMouseX = 0;
      let isInteracting = false;

      function animate() {
        currentVelocity += (targetVelocity - currentVelocity) * 0.04;
        currentRotation = (currentRotation + currentVelocity) % 360;
        ringSvg.style.transform = `rotate(${currentRotation}deg)`;
        requestAnimationFrame(animate);
      }
      animate();

      container.addEventListener('pointermove', (e) => {
        const rect = container.getBoundingClientRect();
        const centerX = rect.left + rect.width / 2;
        const centerY = rect.top + rect.height / 2;
        const deltaX = e.clientX - centerX;
        const deltaY = e.clientY - centerY;
        const dist = Math.sqrt(deltaX * deltaX + deltaY * deltaY);

        // Calculate angular velocity push
        const speed = Math.min(Math.max((e.clientX - lastMouseX) * 0.1, -3), 3);
        targetVelocity = speed !== 0 ? speed : (deltaX > 0 ? 0.8 : -0.8);
        lastMouseX = e.clientX;
      });

      container.addEventListener('pointerleave', () => {
        targetVelocity = 0.25; // Return to serene baseline
      });

      // Drag to spin manually
      let isDragging = false;
      let dragStartAngle = 0;

      container.addEventListener('pointerdown', (e) => {
        isDragging = true;
        const rect = container.getBoundingClientRect();
        const centerX = rect.left + rect.width / 2;
        const centerY = rect.top + rect.height / 2;
        dragStartAngle = Math.atan2(e.clientY - centerY, e.clientX - centerX) * (180 / Math.PI) - currentRotation;
      });

      window.addEventListener('pointermove', (e) => {
        if (!isDragging) return;
        const rect = container.getBoundingClientRect();
        const centerX = rect.left + rect.width / 2;
        const centerY = rect.top + rect.height / 2;
        const angle = Math.atan2(e.clientY - centerY, e.clientX - centerX) * (180 / Math.PI);
        const prevRot = currentRotation;
        currentRotation = angle - dragStartAngle;
        currentVelocity = currentRotation - prevRot;
      });

      window.addEventListener('pointerup', () => {
        if (isDragging) {
          isDragging = false;
          targetVelocity = 0.25;
        }
      });
    })();
  </script>
</body>
</html>
