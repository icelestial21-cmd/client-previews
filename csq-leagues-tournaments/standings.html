<div style="background:#F7F8F8;color:#14485D;font-family:Inter,sans-serif;min-height:100vh">
<header style="background:#14485D;color:#ffffff;font-family:Inter,sans-serif">
  <div style="max-width:1320px;margin:0 auto;padding:12px 24px;display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between">

<div style="background:#F7F8F8;border-bottom:1px solid #DAE3E6;font-family:Inter,sans-serif"><div style="max-width:1320px;margin:0 auto;padding:10px 24px;font-size:13px;display:flex;gap:8px;flex-wrap:wrap"><a href="#" style="color:#4C6874">Home</a> <span style="color:#4C6874">›</span> <a href="index.html" style="color:#4C6874">Leagues &amp; Tournaments</a> <span style="color:#4C6874">›</span> <a href="option-a.html" style="color:#4C6874">Christmas Domino League</a> <span style="color:#4C6874">›</span> <span style="color:#14485D;font-weight:500">Standings</span></div></div>
<section class="pips" style="background-color:#14485D;color:#ffffff">
  <div style="max-width:1320px;margin:0 auto;padding:32px 24px 28px;display:flex;flex-wrap:wrap;gap:16px;align-items:flex-end;justify-content:space-between">
    <div>
      <div style="font:700 12px Inter,sans-serif;letter-spacing:.12em;color:#FCAE40">2ND ANNUAL CHRISTMAS DOMINO LEAGUE</div>
      <h1 class="disp" style="margin:6px 0 0;font-size:clamp(52px,9vw,80px);line-height:.9">{{divName}} standings</h1>
      <p style="margin:10px 0 0;font-size:17px;color:#dbe7ec;max-width:640px">Points add up automatically after every result: win {{sc.w}}, draw {{sc.d}}, loss {{sc.l}}. The table decides who goes straight into the bracket and who plays for the last seats.</p>
    </div>
    <div role="group" aria-label="Division" style="display:flex;background:#1d5a72;border-radius:10px;padding:4px;gap:4px">
      <sc-for list="{{divTabs}}" as="d" hint-placeholder-count="2">
        <sc-if value="{{d.on}}" hint-placeholder-val="{{false}}"><button onClick="{{d.pick}}" aria-pressed="true" style="min-height:42px;padding:0 16px;border:0;border-radius:8px;background:#FCAE40;color:#0e3546;font:700 14px Inter,sans-serif;cursor:pointer">{{d.label}}</button></sc-if>
        <sc-if value="{{d.off}}" hint-placeholder-val="{{true}}"><button onClick="{{d.pick}}" aria-pressed="false" style="min-height:42px;padding:0 16px;border:0;border-radius:8px;background:transparent;color:#ffffff;font:500 14px Inter,sans-serif;cursor:pointer">{{d.label}}</button></sc-if>
      </sc-for>
    </div>
  </div>
</section>

<section style="max-width:1320px;margin:0 auto;padding:24px 24px 0;display:flex;flex-wrap:wrap;gap:20px;align-items:flex-start">
  <div style="flex:3 1 640px;min-width:0">
    <div style="display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:12px">
      <div style="display:flex;flex-wrap:wrap;gap:8px;font:600 12px Inter,sans-serif">
        <span style="display:inline-flex;align-items:center;gap:6px;background:#ffffff;border:1px solid #DAE3E6;border-radius:999px;padding:6px 10px"><i style="width:10px;height:10px;border-radius:3px;background:#1f9d6b"></i>Straight to bracket · 1–{{z.direct}}</span>
        <span style="display:inline-flex;align-items:center;gap:6px;background:#ffffff;border:1px solid #DAE3E6;border-radius:999px;padding:6px 10px"><i style="width:10px;height:10px;border-radius:3px;background:#FCAE40"></i>Seat playoff · {{z.poFrom}}–{{z.poTo}}</span>
        <span style="display:inline-flex;align-items:center;gap:6px;background:#ffffff;border:1px solid #DAE3E6;border-radius:999px;padding:6px 10px"><i style="width:10px;height:10px;border-radius:3px;background:#c9d4d8"></i>Out</span>
      </div>
      <span style="font-size:13px;color:#4C6874">{{played}} results recorded</span>
    </div>
    <div style="overflow-x:auto;background:#ffffff;border:1px solid #DAE3E6;border-radius:16px">
      <div style="min-width:720px">
        <div style="display:grid;grid-template-columns:56px minmax(0,1.6fr) minmax(0,1.2fr) 44px 44px 44px 44px 64px;gap:8px;padding:12px 16px;font:700 12px Inter,sans-serif;letter-spacing:.06em;color:#4C6874;border-bottom:1px solid #DAE3E6"><span>POS</span><span>PLAYER</span><span>TEAM</span><span style="text-align:center">P</span><span style="text-align:center">W</span><span style="text-align:center">D</span><span style="text-align:center">L</span><span style="text-align:right">PTS</span></div>
        <sc-for list="{{rows}}" as="r" hint-placeholder-count="20">
          <sc-if value="{{r.cut}}" hint-placeholder-val="{{false}}"><div style="padding:6px 16px;background:#F7F8F8;border-bottom:1px solid #DAE3E6;font:700 11px Inter,sans-serif;letter-spacing:.1em;color:{{r.cutColor}}">{{r.cutLabel}}</div></sc-if>
          <div style="display:grid;grid-template-columns:56px minmax(0,1.6fr) minmax(0,1.2fr) 44px 44px 44px 44px 64px;gap:8px;padding:10px 16px;border-bottom:1px solid #E8ECED;align-items:center;font-size:14px;box-shadow:inset 4px 0 0 {{r.zc}}">
            <span class="disp" style="font-size:22px">{{r.pos}}</span>
            <span><strong>{{r.name}}</strong> <span style="color:#CC1F19">{{r.nickLine}}</span></span>
            <span style="color:#4C6874">{{r.team}}</span>
            <span style="text-align:center">{{r.p}}</span><span style="text-align:center">{{r.w}}</span><span style="text-align:center">{{r.d}}</span><span style="text-align:center">{{r.l}}</span>
            <span class="disp" style="text-align:right;font-size:24px">{{r.pts}}</span>
          </div>
        </sc-for>
      </div>
    </div>
    <div style="display:flex;justify-content:center;margin:12px 0 0">
      <sc-if value="{{canMore}}" hint-placeholder-val="{{true}}"><button onClick="{{more}}" style="min-height:44px;padding:0 20px;border-radius:999px;border:1px solid #14485D;background:#ffffff;color:#14485D;font:700 14px Inter,sans-serif;cursor:pointer">Show all {{total}} players</button></sc-if>
      <sc-if value="{{canLess}}" hint-placeholder-val="{{false}}"><button onClick="{{less}}" style="min-height:44px;padding:0 20px;border-radius:999px;border:1px solid #14485D;background:#ffffff;color:#14485D;font:700 14px Inter,sans-serif;cursor:pointer">Show fewer</button></sc-if>
    </div>
  </div>

  <aside style="flex:1 1 320px;min-width:0;display:flex;flex-direction:column;gap:16px">
    <div style="background:#ffffff;border:1px solid #DAE3E6;border-radius:16px;padding:20px">
      <h2 class="disp" style="margin:0;font-size:28px">Record a result</h2>
      <p style="margin:4px 0 12px;font-size:13px;color:#4C6874">Demo of the scorekeeper’s screen. Points update instantly.</p>
      <label style="display:block;font:600 12px Inter,sans-serif;color:#4C6874;margin-bottom:4px" for="ra">Player A</label>
      <select id="ra" style="width:100%;min-height:44px;border:1px solid #DAE3E6;border-radius:10px;padding:0 10px;font:14px Inter,sans-serif;color:#14485D;background:#F7F8F8"><sc-for list="{{opts}}" as="o" hint-placeholder-count="10"><option value="{{o.id}}">{{o.label}}</option></sc-for></select>
      <label style="display:block;font:600 12px Inter,sans-serif;color:#4C6874;margin:10px 0 4px" for="rb">Player B</label>
      <select id="rb" style="width:100%;min-height:44px;border:1px solid #DAE3E6;border-radius:10px;padding:0 10px;font:14px Inter,sans-serif;color:#14485D;background:#F7F8F8"><sc-for list="{{optsB}}" as="o" hint-placeholder-count="10"><option value="{{o.id}}">{{o.label}}</option></sc-for></select>
      <div role="group" aria-label="Result" style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-top:12px">
        <button onClick="{{recA}}" style="min-height:44px;border-radius:10px;border:0;background:#14485D;color:#ffffff;font:700 13px Inter,sans-serif;cursor:pointer">A wins</button>
        <button onClick="{{recD}}" style="min-height:44px;border-radius:10px;border:1px solid #14485D;background:#ffffff;color:#14485D;font:700 13px Inter,sans-serif;cursor:pointer">Draw</button>
        <button onClick="{{recB}}" style="min-height:44px;border-radius:10px;border:0;background:#14485D;color:#ffffff;font:700 13px Inter,sans-serif;cursor:pointer">B wins</button>
      </div>
      <sc-if value="{{msg}}" hint-placeholder-val="{{false}}"><p style="margin:10px 0 0;font-size:13px;color:#CC1F19">{{msg}}</p></sc-if>
      <div style="display:flex;gap:8px;margin-top:14px;flex-wrap:wrap">
        <button onClick="{{simulate}}" style="flex:1 1 140px;min-height:42px;border-radius:999px;border:0;background:#FCAE40;color:#0e3546;font:700 13px Inter,sans-serif;cursor:pointer">Fill demo results</button>
        <button onClick="{{clear}}" style="flex:1 1 100px;min-height:42px;border-radius:999px;border:1px solid #DAE3E6;background:#ffffff;color:#4C6874;font:600 13px Inter,sans-serif;cursor:pointer">Clear all</button>
      </div>
      <sc-if value="{{hasRecent}}" hint-placeholder-val="{{false}}">
        <div style="font:700 11px Inter,sans-serif;letter-spacing:.1em;color:#4C6874;margin:16px 0 4px">LATEST RESULTS</div>
        <sc-for list="{{recent}}" as="x" hint-placeholder-count="5"><div style="font-size:13px;padding:6px 0;border-bottom:1px solid #E8ECED">{{x}}</div></sc-for>
      </sc-if>
    </div>

    <div style="background:#ffffff;border:1px solid #DAE3E6;border-radius:16px;padding:20px">
      <h2 class="disp" style="margin:0;font-size:28px">Bracket settings</h2>
      <p style="margin:4px 0 10px;font-size:13px;color:#4C6874">Seats in the knockout bracket, and how many go to the seat playoff.</p>
      <div style="font:600 12px Inter,sans-serif;color:#4C6874;margin-bottom:6px">Bracket size</div>
      <div style="display:flex;gap:6px;margin-bottom:12px">
        <sc-for list="{{seatOpts}}" as="o" hint-placeholder-count="2">
          <sc-if value="{{o.on}}" hint-placeholder-val="{{false}}"><button onClick="{{o.pick}}" aria-pressed="true" style="flex:1;min-height:42px;border-radius:10px;border:0;background:#14485D;color:#ffffff;font:700 14px Inter,sans-serif;cursor:pointer">{{o.label}}</button></sc-if>
          <sc-if value="{{o.off}}" hint-placeholder-val="{{true}}"><button onClick="{{o.pick}}" aria-pressed="false" style="flex:1;min-height:42px;border-radius:10px;border:1px solid #DAE3E6;background:#ffffff;color:#14485D;font:600 14px Inter,sans-serif;cursor:pointer">{{o.label}}</button></sc-if>
        </sc-for>
      </div>
      <div style="font:600 12px Inter,sans-serif;color:#4C6874;margin-bottom:6px">Seats decided by playoff</div>
      <div style="display:flex;gap:6px">
        <sc-for list="{{wcOpts}}" as="o" hint-placeholder-count="4">
          <sc-if value="{{o.on}}" hint-placeholder-val="{{false}}"><button onClick="{{o.pick}}" aria-pressed="true" style="flex:1;min-height:42px;border-radius:10px;border:0;background:#14485D;color:#ffffff;font:700 14px Inter,sans-serif;cursor:pointer">{{o.label}}</button></sc-if>
          <sc-if value="{{o.off}}" hint-placeholder-val="{{true}}"><button onClick="{{o.pick}}" aria-pressed="false" style="flex:1;min-height:42px;border-radius:10px;border:1px solid #DAE3E6;background:#ffffff;color:#14485D;font:600 14px Inter,sans-serif;cursor:pointer">{{o.label}}</button></sc-if>
        </sc-for>
      </div>
    </div>
  </aside>
</section>

<section style="max-width:1320px;margin:0 auto;padding:40px 24px 0">
  <h2 class="disp" style="margin:0;font-size:44px">Seat playoff</h2>
  <p style="margin:4px 0 16px;font-size:15px;color:#4C6874">{{z.seats}} seats in the bracket. Places 1–{{z.direct}} go straight in. Places {{z.poFrom}}–{{z.poTo}} play off for the last {{z.wc}}: best against worst.</p>
  <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(min(280px,100%),1fr));gap:12px">
    <sc-for list="{{pairs}}" as="m" hint-placeholder-count="4">
      <div class="lift" style="background:#ffffff;border:2px solid #FCAE40;border-radius:16px;padding:16px">
        <div style="font:700 11px Inter,sans-serif;letter-spacing:.1em;color:#CC1F19">PLAYOFF {{m.n}} · WINNER TAKES SEAT {{m.seat}}</div>
        <div style="display:flex;align-items:center;gap:10px;margin-top:10px">
          <span class="disp" style="flex:0 0 36px;height:36px;border-radius:10px;background:#14485D;color:#FCAE40;display:flex;align-items:center;justify-content:center;font-size:18px">{{m.ap}}</span>
          <span style="flex:1;min-width:0"><strong>{{m.a}}</strong><br><span style="font-size:12px;color:#4C6874">{{m.at}}</span></span>
        </div>
        <div style="text-align:center;font:700 11px Inter,sans-serif;letter-spacing:.1em;color:#4C6874;margin:6px 0">VS</div>
        <div style="display:flex;align-items:center;gap:10px">
          <span class="disp" style="flex:0 0 36px;height:36px;border-radius:10px;background:#E8ECED;color:#14485D;display:flex;align-items:center;justify-content:center;font-size:18px">{{m.bp}}</span>
          <span style="flex:1;min-width:0"><strong>{{m.b}}</strong><br><span style="font-size:12px;color:#4C6874">{{m.bt}}</span></span>
        </div>
      </div>
    </sc-for>
  </div>
</section>

<section style="max-width:1320px;margin:0 auto;padding:40px 24px 64px">
  <h2 class="disp" style="margin:0;font-size:44px">How it all connects</h2>
  <p style="margin:4px 0 18px;font-size:15px;color:#4C6874">Standings feed the seat playoff and the bracket. The bracket decides first, second and third.</p>
  <div style="background:#0e3546;border-radius:20px;padding:24px;color:#ffffff;overflow-x:auto">
    <div style="min-width:900px;display:grid;grid-template-columns:1fr 60px 1fr 60px 1fr 60px 1fr;align-items:center;gap:0">
      <div style="background:#14485D;border:2px solid #3a7590;border-radius:16px;padding:16px">
        <div style="font:700 11px Inter,sans-serif;letter-spacing:.1em;color:#FCAE40">1 · STANDINGS</div>
        <div class="disp" style="font-size:26px;line-height:1.05;margin-top:4px">First &amp; Second Round</div>
        <p style="margin:6px 0 0;font-size:13px;color:#dbe7ec">Every result adds points: W {{sc.w}} · D {{sc.d}} · L {{sc.l}}. Nov 30 – Dec 17.</p>
      </div>
      <svg viewBox="0 0 60 120" aria-hidden="true" style="width:60px;height:120px"><path d="M4 30 C30 30 30 20 54 20" stroke="#1f9d6b" stroke-width="3" fill="none"></path><path d="M4 90 C30 90 30 100 54 100" stroke="#FCAE40" stroke-width="3" fill="none"></path><path d="M48 14l7 6-7 6M48 94l7 6-7 6" stroke-width="3" fill="none" stroke="#ffffff"></path></svg>
      <div style="display:flex;flex-direction:column;gap:12px">
        <div style="background:#123f52;border:2px solid #1f9d6b;border-radius:14px;padding:12px">
          <div style="font:700 11px Inter,sans-serif;letter-spacing:.1em;color:#7fe0b6">PLACES 1–{{z.direct}}</div>
          <div style="font-size:14px;margin-top:2px">Straight into the bracket</div>
        </div>
        <div style="background:#123f52;border:2px solid #FCAE40;border-radius:14px;padding:12px">
          <div style="font:700 11px Inter,sans-serif;letter-spacing:.1em;color:#FCAE40">2 · SEAT PLAYOFF · PLACES {{z.poFrom}}–{{z.poTo}}</div>
          <div style="font-size:14px;margin-top:2px">{{z.pool}} players, {{z.wc}} matches, {{z.wc}} winners take the last seats</div>
        </div>
      </div>
      <svg viewBox="0 0 60 120" aria-hidden="true" style="width:60px;height:120px"><path d="M4 30 C30 30 30 60 54 60" stroke="#1f9d6b" stroke-width="3" fill="none"></path><path d="M4 90 C30 90 30 60 54 60" stroke="#FCAE40" stroke-width="3" fill="none"></path><path d="M48 54l7 6-7 6" stroke-width="3" fill="none" stroke="#ffffff"></path></svg>
      <div style="background:#14485D;border:2px solid #FCAE40;border-radius:16px;padding:16px">
        <div style="font:700 11px Inter,sans-serif;letter-spacing:.1em;color:#FCAE40">3 · KNOCKOUT BRACKET</div>
