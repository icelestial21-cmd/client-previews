<template id="tpl">

<div style="background:#F7F8F8;color:#14485D;font-family:Inter,sans-serif;min-height:100vh">
<header style="background:#14485D;color:#ffffff;font-family:Inter,sans-serif">
  <div style="max-width:1320px;margin:0 auto;padding:12px 24px;display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between">
    <a href="index.html" style="display:flex;align-items:center;gap:10px;color:#ffffff"><span style="width:40px;height:40px;border-radius:10px;background:#1d5a72;border:1px solid #3a7590;display:flex;align-items:center;justify-content:center;font:400 16px 'Bebas Neue',sans-serif;color:#FCAE40">CSQ</span><span style="font:400 24px 'Bebas Neue',sans-serif;letter-spacing:.03em">CARIBBEAN SPORTS QUEST</span></a>

      <a href="index.html" style="padding:8px 12px;color:#FCAE40;background:rgba(204,31,25,.2);border-radius:10px">Leagues &amp; Tournaments</a>

    </nav>

</header>
<div style="background:#F7F8F8;border-bottom:1px solid #DAE3E6;font-family:Inter,sans-serif"><div style="max-width:1320px;margin:0 auto;padding:10px 24px;font-size:13px;display:flex;gap:8px;flex-wrap:wrap"><a href="#" style="color:#4C6874">Home</a> <span style="color:#4C6874">›</span> <a href="index.html" style="color:#4C6874">Leagues &amp; Tournaments</a> <span style="color:#4C6874">›</span> <a href="league.html" style="color:#4C6874">Christmas Domino League</a> <span style="color:#4C6874">›</span> <span style="color:#14485D;font-weight:500">Standings</span></div></div>
<section class="pips" style="background-color:#14485D;color:#ffffff">
  <div style="max-width:1320px;margin:0 auto;padding:32px 24px 28px;display:flex;flex-wrap:wrap;gap:16px;align-items:flex-end;justify-content:space-between">
    <div>
      <div style="font:700 12px Inter,sans-serif;letter-spacing:.12em;color:#FCAE40">2ND ANNUAL CHRISTMAS DOMINO LEAGUE</div>
      <h1 class="disp" style="margin:6px 0 0;font-size:clamp(52px,9vw,80px);line-height:.9">{{divName}} standings</h1>
      <p style="margin:10px 0 0;font-size:17px;color:#dbe7ec;max-width:640px">Every set is first to {{sc.setTo}} points. A win earns {{sc.w}} standings points and a loss {{sc.l}}; level players are split by points difference. The table decides who goes straight into the bracket and who plays for the last seats.</p>
    </div>
    <div role="group" aria-label="Division" style="display:flex;background:#1d5a72;border-radius:10px;padding:4px;gap:4px">
      <sc-for list="{{divTabs}}" as="d" hint-placeholder-count="2">
        <sc-if value="{{d.on}}" hint-placeholder-val="{{false}}"><button onClick="{{d.pick}}" aria-pressed="true" style="min-height:42px;padding:0 16px;border:0;border-radius:8px;background:#FCAE40;color:#0e3546;font:700 14px Inter,sans-serif;cursor:pointer">{{d.label}}</button></sc-if>
        <sc-if value="{{d.off}}" hint-placeholder-val="{{true}}"><button onClick="{{d.pick}}" aria-pressed="false" style="min-height:42px;padding:0 16px;border:0;border-radius:8px;background:transparent;color:#ffffff;font:500 14px Inter,sans-serif;cursor:pointer">{{d.label}}</button></sc-if>
      </sc-for>
    </div>
  </div>
</section>

<section style="max-width:1320px;margin:0 auto;padding:24px 24px 0;display:flex;flex-wrap:wrap;gap:20px;align-items:flex-start">
  <div style="flex:3 1 640px;min-width:0">
    <div style="display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:12px">
      <div style="display:flex;flex-wrap:wrap;gap:8px;font:600 12px Inter,sans-serif">
        <span style="display:inline-flex;align-items:center;gap:6px;background:#ffffff;border:1px solid #DAE3E6;border-radius:999px;padding:6px 10px"><i style="width:10px;height:10px;border-radius:3px;background:#1f9d6b"></i>Straight to bracket · 1–{{z.direct}}</span>
        <span style="display:inline-flex;align-items:center;gap:6px;background:#ffffff;border:1px solid #DAE3E6;border-radius:999px;padding:6px 10px"><i style="width:10px;height:10px;border-radius:3px;background:#FCAE40"></i>Seat playoff · {{z.poFrom}}–{{z.poTo}}</span>
        <span style="display:inline-flex;align-items:center;gap:6px;background:#ffffff;border:1px solid #DAE3E6;border-radius:999px;padding:6px 10px"><i style="width:10px;height:10px;border-radius:3px;background:#c9d4d8"></i>Out</span>
      </div>
      <span style="font-size:13px;color:#4C6874">{{played}} results recorded</span>
    </div>
    <div style="overflow-x:auto;background:#ffffff;border:1px solid #DAE3E6;border-radius:16px">
      <div style="min-width:780px">
        <div style="display:grid;grid-template-columns:56px minmax(0,1.6fr) minmax(0,1.2fr) 40px 40px 40px 52px 52px 56px 64px;gap:8px;padding:12px 16px;font:700 12px Inter,sans-serif;letter-spacing:.06em;color:#4C6874;border-bottom:1px solid #DAE3E6"><span>POS</span><span>PLAYER</span><span>TEAM</span><span style="text-align:center">P</span><span style="text-align:center">W</span><span style="text-align:center">L</span><span style="text-align:center" title="Game points won">PF</span><span style="text-align:center" title="Game points against">PA</span><span style="text-align:center">+/−</span><span style="text-align:right">PTS</span></div>
        <sc-for list="{{rows}}" as="r" hint-placeholder-count="20">
          <sc-if value="{{r.cut}}" hint-placeholder-val="{{false}}"><div style="padding:6px 16px;background:#F7F8F8;border-bottom:1px solid #DAE3E6;font:700 11px Inter,sans-serif;letter-spacing:.1em;color:{{r.cutColor}}">{{r.cutLabel}}</div></sc-if>
          <div style="display:grid;grid-template-columns:56px minmax(0,1.6fr) minmax(0,1.2fr) 40px 40px 40px 52px 52px 56px 64px;gap:8px;padding:10px 16px;border-bottom:1px solid #E8ECED;align-items:center;font-size:14px;box-shadow:inset 4px 0 0 {{r.zc}}">
            <span class="disp" style="font-size:22px">{{r.pos}}</span>
            <span><strong>{{r.name}}</strong> <span style="color:#CC1F19">{{r.nickLine}}</span></span>
            <span style="color:#4C6874">{{r.team}}</span>
            <span style="text-align:center">{{r.p}}</span><span style="text-align:center">{{r.w}}</span><span style="text-align:center">{{r.l}}</span><span style="text-align:center">{{r.pf}}</span><span style="text-align:center">{{r.pa}}</span><span style="text-align:center;color:{{r.dc}};font-weight:600">{{r.diff}}</span>
            <span class="disp" style="text-align:right;font-size:24px">{{r.pts}}</span>
          </div>
        </sc-for>
      </div>
    </div>
    <div style="display:flex;justify-content:center;margin:12px 0 0">
      <sc-if value="{{canMore}}" hint-placeholder-val="{{true}}"><button onClick="{{more}}" style="min-height:44px;padding:0 20px;border-radius:999px;border:1px solid #14485D;background:#ffffff;color:#14485D;font:700 14px Inter,sans-serif;cursor:pointer">Show all {{total}} players</button></sc-if>
      <sc-if value="{{canLess}}" hint-placeholder-val="{{false}}"><button onClick="{{less}}" style="min-height:44px;padding:0 20px;border-radius:999px;border:1px solid #14485D;background:#ffffff;color:#14485D;font:700 14px Inter,sans-serif;cursor:pointer">Show fewer</button></sc-if>
    </div>
  </div>

  <aside style="flex:1 1 320px;min-width:0;display:flex;flex-direction:column;gap:16px">
    <div style="background:#ffffff;border:1px solid #DAE3E6;border-radius:16px;padding:20px">
      <h2 class="disp" style="margin:0;font-size:28px">Record a result</h2>
      <p style="margin:4px 0 12px;font-size:13px;color:#4C6874">Demo of the scorekeeper’s screen. Enter the set score (first to {{sc.setTo}}); the table updates instantly.</p>
      <label style="display:block;font:600 12px Inter,sans-serif;color:#4C6874;margin-bottom:4px" for="ra">Player A</label>
      <select id="ra" style="width:100%;min-height:44px;border:1px solid #DAE3E6;border-radius:10px;padding:0 10px;font:14px Inter,sans-serif;color:#14485D;background:#F7F8F8"><sc-for list="{{opts}}" as="o" hint-placeholder-count="10"><option value="{{o.id}}">{{o.label}}</option></sc-for></select>
      <label style="display:block;font:600 12px Inter,sans-serif;color:#4C6874;margin:10px 0 4px" for="rb">Player B</label>
      <select id="rb" style="width:100%;min-height:44px;border:1px solid #DAE3E6;border-radius:10px;padding:0 10px;font:14px Inter,sans-serif;color:#14485D;background:#F7F8F8"><sc-for list="{{optsB}}" as="o" hint-placeholder-count="10"><option value="{{o.id}}">{{o.label}}</option></sc-for></select>
      <div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:12px">
        <label style="font:600 12px Inter,sans-serif;color:#4C6874">A’s points<input id="sa" type="number" min="0" max="{{sc.setTo}}" value="{{sc.setTo}}" style="display:block;width:100%;box-sizing:border-box;margin-top:4px;min-height:44px;border:1px solid #DAE3E6;border-radius:10px;padding:0 10px;font:600 16px Inter,sans-serif;color:#14485D"></label>
        <label style="font:600 12px Inter,sans-serif;color:#4C6874">B’s points<input id="sb" type="number" min="0" max="{{sc.setTo}}" value="0" style="display:block;width:100%;box-sizing:border-box;margin-top:4px;min-height:44px;border:1px solid #DAE3E6;border-radius:10px;padding:0 10px;font:600 16px Inter,sans-serif;color:#14485D"></label>
      </div>
      <button onClick="{{rec}}" style="width:100%;margin-top:10px;min-height:46px;border-radius:999px;border:0;background:#14485D;color:#ffffff;font:700 14px Inter,sans-serif;cursor:pointer">Save result</button>
      <p style="margin:8px 0 0;font-size:12px;color:#4C6874">Red card, walk-off or forfeit: the remaining points go to the opponent, so enter {{sc.setTo}} for them. <button onClick="{{rulesRed}}" style="border:0;background:none;padding:0;color:#CC1F19;font:600 12px Inter,sans-serif;text-decoration:underline;cursor:pointer">Rule</button></p>
      <sc-if value="{{msg}}" hint-placeholder-val="{{false}}"><p style="margin:10px 0 0;font-size:13px;color:#CC1F19">{{msg}}</p></sc-if>
      <div style="display:flex;gap:8px;margin-top:14px;flex-wrap:wrap">
        <button onClick="{{simulate}}" style="flex:1 1 140px;min-height:42px;border-radius:999px;border:0;background:#FCAE40;color:#0e3546;font:700 13px Inter,sans-serif;cursor:pointer">Fill demo results</button>
        <button onClick="{{clear}}" style="flex:1 1 100px;min-height:42px;border-radius:999px;border:1px solid #DAE3E6;background:#ffffff;color:#4C6874;font:600 13px Inter,sans-serif;cursor:pointer">Clear all</button>
      </div>
      <sc-if value="{{hasRecent}}" hint-placeholder-val="{{false}}">
        <div style="font:700 11px Inter,sans-serif;letter-spacing:.1em;color:#4C6874;margin:16px 0 4px">LATEST RESULTS</div>
        <sc-for list="{{recent}}" as="x" hint-placeholder-count="5"><div style="font-size:13px;padding:6px 0;border-bottom:1px solid #E8ECED">{{x}}</div></sc-for>
      </sc-if>
    </div>

    <div style="background:#ffffff;border:1px solid #DAE3E6;border-radius:16px;padding:20px">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><h2 class="disp" style="margin:0;font-size:28px">Scoring rules</h2><button onClick="{{rules.openAll}}" style="min-height:40px;padding:0 14px;border-radius:999px;border:0;background:#14485D;color:#ffffff;font:700 13px Inter,sans-serif;cursor:pointer">All rules</button></div>
      <p style="margin:4px 0 8px;font-size:13px;color:#4C6874">From the official rules. These settings drive the table.</p>
      <sc-for list="{{scoreRules}}" as="sr" hint-placeholder-count="5">
        <button onClick="{{sr.pick}}" style="width:100%;display:flex;justify-content:space-between;gap:10px;align-items:center;text-align:left;padding:10px 0;border:0;border-bottom:1px solid #E8ECED;background:none;cursor:pointer;font:inherit;color:#14485D"><span style="font-size:14px">{{sr.label}}</span><strong class="disp" style="font-size:20px;color:#CC1F19;white-space:nowrap">{{sr.value}} ›</strong></button>
      </sc-for>
    </div>

    <div style="background:#ffffff;border:1px solid #DAE3E6;border-radius:16px;padding:20px">
      <h2 class="disp" style="margin:0;font-size:28px">Bracket settings</h2>
      <p style="margin:4px 0 10px;font-size:13px;color:#4C6874">Seats in the knockout bracket, and how many go to the seat playoff.</p>
      <div style="font:600 12px Inter,sans-serif;color:#4C6874;margin-bottom:6px">Bracket size</div>
      <div style="display:flex;gap:6px;margin-bottom:12px">
        <sc-for list="{{seatOpts}}" as="o" hint-placeholder-count="2">
          <sc-if value="{{o.on}}" hint-placeholder-val="{{false}}"><button onClick="{{o.pick}}" aria-pressed="true" style="flex:1;min-height:42px;border-radius:10px;border:0;background:#14485D;color:#ffffff;font:700 14px Inter,sans-serif;cursor:pointer">{{o.label}}</button></sc-if>
          <sc-if value="{{o.off}}" hint-placeholder-val="{{true}}"><button onClick="{{o.pick}}" aria-pressed="false" style="flex:1;min-height:42px;border-radius:10px;border:1px solid #DAE3E6;background:#ffffff;color:#14485D;font:600 14px Inter,sans-serif;cursor:pointer">{{o.label}}</button></sc-if>
        </sc-for>
      </div>
      <div style="font:600 12px Inter,sans-serif;color:#4C6874;margin-bottom:6px">Seats decided by playoff</div>
      <div style="display:flex;gap:6px">
        <sc-for list="{{wcOpts}}" as="o" hint-placeholder-count="4">
          <sc-if value="{{o.on}}" hint-placeholder-val="{{false}}"><button onClick="{{o.pick}}" aria-pressed="true" style="flex:1;min-height:42px;border-radius:10px;border:0;background:#14485D;color:#ffffff;font:700 14px Inter,sans-serif;cursor:pointer">{{o.label}}</button></sc-if>
          <sc-if value="{{o.off}}" hint-placeholder-val="{{true}}"><button onClick="{{o.pick}}" aria-pressed="false" style="flex:1;min-height:42px;border-radius:10px;border:1px solid #DAE3E6;background:#ffffff;color:#14485D;font:600 14px Inter,sans-serif;cursor:pointer">{{o.label}}</button></sc-if>
        </sc-for>
      </div>
    </div>
  </aside>
</section>

<section style="max-width:1320px;margin:0 auto;padding:40px 24px 0">
  <h2 class="disp" style="margin:0;font-size:44px">Seat playoff</h2>
  <p style="margin:4px 0 16px;font-size:15px;color:#4C6874">{{z.seats}} seats in the bracket. Places 1–{{z.direct}} go straight in. Places {{z.poFrom}}–{{z.poTo}} play off for the last {{z.wc}}: best against worst.</p>
  <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(min(280px,100%),1fr));gap:12px">
    <sc-for list="{{pairs}}" as="m" hint-placeholder-count="4">
      <div class="lift" style="background:#ffffff;border:2px solid #FCAE40;border-radius:16px;padding:16px">
        <div style="font:700 11px Inter,sans-serif;letter-spacing:.1em;color:#CC1F19">PLAYOFF {{m.n}} · WINNER TAKES SEAT {{m.seat}}</div>
        <div style="display:flex;align-items:center;gap:10px;margin-top:10px">
          <span class="disp" style="flex:0 0 36px;height:36px;border-radius:10px;background:#14485D;color:#FCAE40;display:flex;align-items:center;justify-content:center;font-size:18px">{{m.ap}}</span>
          <span style="flex:1;min-width:0"><strong>{{m.a}}</strong><br><span style="font-size:12px;color:#4C6874">{{m.at}}</span></span>
        </div>
        <div style="text-align:center;font:700 11px Inter,sans-serif;letter-spacing:.1em;color:#4C6874;margin:6px 0">VS</div>
        <div style="display:flex;align-items:center;gap:10px">
          <span class="disp" style="flex:0 0 36px;height:36px;border-radius:10px;background:#E8ECED;color:#14485D;display:flex;align-items:center;justify-content:center;font-size:18px">{{m.bp}}</span>
          <span style="flex:1;min-width:0"><strong>{{m.b}}</strong><br><span style="font-size:12px;color:#4C6874">{{m.bt}}</span></span>
        </div>
      </div>
    </sc-for>
  </div>
</section>

<section style="max-width:1320px;margin:0 auto;padding:40px 24px 64px">
  <h2 class="disp" style="margin:0;font-size:44px">How it all connects</h2>
  <p style="margin:4px 0 18px;font-size:15px;color:#4C6874">Standings feed the seat playoff and the bracket. The bracket decides first, second and third.</p>
  <div style="background:#0e3546;border-radius:20px;padding:24px;color:#ffffff;overflow-x:auto">
    <div style="min-width:900px;display:grid;grid-template-columns:1fr 60px 1fr 60px 1fr 60px 1fr;align-items:center;gap:0">
      <div style="background:#14485D;border:2px solid #3a7590;border-radius:16px;padding:16px">
        <div style="font:700 11px Inter,sans-serif;letter-spacing:.1em;color:#FCAE40">1 · STANDINGS</div>
        <div class="disp" style="font-size:26px;line-height:1.05;margin-top:4px">First &amp; Second Round</div>

    stop: function (e) { if (e && e.stopPropagation) e.stopPropagation(); },
    tabs: RULES.map(function (r) { return { label: r.title, on: sec === r.id, off: sec !== r.id, pick: function () { self.setState({ ruleSec: r.id }); go(r.id + '-sec'); } }; }),
    sections: RULES.map(function (r) { return { id: r.id + '-sec', title: r.title, items: r.items.map(function (it) { n++; var f = focus === it.id;
      return { id: it.id, no: n, text: it.text, list: it.list || [], hasList: !!(it.list && it.list.length), tag: it.tag ? TAGS[it.tag] : '', hasTag: !!it.tag, bg: f ? '#FFF4E0' : '#ffffff', bd: f ? '#FCAE40' : '#E8ECED' }; }) }; }),
    openRule: function (id, secId) { return function () { self.setState({ rulesOpen: true, ruleFocus: id, ruleSec: secId }); go(id); }; }
  };
}

class Component extends DCLogic {
  constructor(p) {
    super(p);
    var res = []; try { res = JSON.parse(localStorage.getItem('csq_results_v2') || '[]'); } catch (e) {}
    var d = 'men'; try { if (new URLSearchParams(location.search).get('div') === 'women') d = 'women'; } catch (e) {}
    this.state = { div: d, res: res, seats: 32, wc: 4, all: false, msg: '' };
    this.players = csqPlayers();
  }
  save(res) { try { localStorage.setItem('csq_results_v2', JSON.stringify(res)); } catch (e) {} this.setState({ res: res, msg: '' }); }
  renderVals() {
    var self = this, s = this.state, W = s.div === 'women', R = RULESET, SET = R.setTo;
    var ps = this.players.filter(function (p) { return p.div === s.div; });
    var byId = {}; ps.forEach(function (p) { byId[p.id] = { p: p, P: 0, W: 0, L: 0, PF: 0, PA: 0 }; });
    var mine = s.res.filter(function (r) { return byId[r.a] && byId[r.b]; });
    mine.forEach(function (r) { var A = byId[r.a], B = byId[r.b]; A.P++; B.P++; A.PF += r.sa; A.PA += r.sb; B.PF += r.sb; B.PA += r.sa;
      if (r.sa > r.sb) { A.W++; B.L++; } else { B.W++; A.L++; } });
    var tbl = Object.keys(byId).map(function (k) { var x = byId[k]; x.pts = x.W * R.win + x.L * R.loss; x.diff = x.PF - x.PA; return x; });
    tbl.sort(function (a, b) { return b.pts - a.pts || b.diff - a.diff || b.PF - a.PF || a.p.name.localeCompare(b.p.name); });
    var n = tbl.length, seats = s.seats, wc = Math.min(s.wc, seats), direct = Math.min(seats - wc, n), pool = Math.max(0, Math.min(wc * 2, n - direct));
    var poFrom = direct + 1, poTo = direct + pool;
    var zone = function (i) { return i < direct ? '#1f9d6b' : i < poTo ? '#FCAE40' : '#c9d4d8'; };
    var limit = s.all ? n : Math.min(n, poTo + 6);
    var rows = tbl.slice(0, limit).map(function (x, i) {
      var cut = (i === direct && pool > 0) || (i === poTo && i > 0);
      return { pos: i + 1, name: x.p.name, nickLine: x.p.nickLine, team: x.p.team, p: x.P, w: x.W, l: x.L, pf: x.PF, pa: x.PA, diff: (x.diff > 0 ? '+' : '') + x.diff, dc: x.diff > 0 ? '#1f7a55' : x.diff < 0 ? '#CC1F19' : '#4C6874', pts: x.pts, zc: zone(i),
        cut: cut, cutLabel: i === direct && pool > 0 ? 'SEAT PLAYOFF · PLACES ' + poFrom + '–' + poTo : 'OUT OF THE BRACKET', cutColor: i === direct && pool > 0 ? '#b26b00' : '#4C6874' };
    });
    var pairs = []; for (var k = 0; k < Math.floor(pool / 2); k++) { var A = tbl[direct + k], B = tbl[poTo - 1 - k];
      pairs.push({ n: k + 1, seat: direct + k + 1, a: A.p.name, at: A.p.team + ' · ' + A.pts + ' pts', ap: direct + k + 1, b: B.p.name, bt: B.p.team + ' · ' + B.pts + ' pts', bp: poTo - k }); }
    var opts = tbl.map(function (x) { return { id: x.p.id, label: x.p.name + (x.p.nick ? ' “' + x.p.nick + '”' : '') + ' · ' + x.p.team }; }).sort(function (a, b) { return a.label.localeCompare(b.label); });
    var rec = function () { var a = '', b = '', sa = 0, sb = 0; try { a = document.getElementById('ra').value; b = document.getElementById('rb').value; sa = parseInt(document.getElementById('sa').value, 10); sb = parseInt(document.getElementById('sb').value, 10); } catch (e) {}
      if (!a || !b || a === b) { self.setState({ msg: 'Pick two different players.' }); return; }
      if (isNaN(sa) || isNaN(sb) || Math.max(sa, sb) !== SET || Math.min(sa, sb) < 0 || sa === sb) { self.setState({ msg: 'One player must reach exactly ' + SET + ' and the other must have fewer.' }); return; }
      self.save(s.res.concat([{ a: a, b: b, sa: sa, sb: sb, t: Date.now() }])); };
    var nm = function (id) { var x = byId[id]; return x ? x.p.name : '?'; };
    var recent = mine.slice(-6).reverse().map(function (r) { return r.sa > r.sb ? nm(r.a) + ' beat ' + nm(r.b) + ' ' + r.sa + '–' + r.sb : nm(r.b) + ' beat ' + nm(r.a) + ' ' + r.sb + '–' + r.sa; });
    return {
      divName: W ? 'Women’s' : 'Men’s', sc: { w: R.win, l: R.loss, setTo: SET }, rules: rulesVals(this), rulesRed: rulesVals(this).openRule('g19', 'play'),
      scoreRules: [['Set is won by the first to', SET + ' pts', 'f2', 'format'], ['Derby game winner earns', R.derby + ' pts (max ' + R.derbyMax + ')', 'g12', 'play'], ['Bathroom break over 5 minutes', '+' + R.latePenalty + ' to opponent', 'g18', 'play'], ['Red card or unfinished set', 'Rest to opponent', 'g19', 'play'], ['Standings: win / loss', R.win + ' / ' + R.loss, 'f2', 'format']].map(function (x) { return { label: x[0], value: x[1], pick: rulesVals(self).openRule(x[2], x[3]) }; }), rows: rows, total: n, played: mine.length, canMore: !s.all && limit < n, canLess: s.all,
      more: function () { self.setState({ all: true }); }, less: function () { self.setState({ all: false }); },
      z: { seats: seats, wc: wc, direct: direct, pool: pool, poFrom: poFrom, poTo: poTo }, pairs: pairs, opts: opts, optsB: opts.slice(1).concat(opts.slice(0, 1)),
      rec: rec, msg: s.msg, recent: recent, hasRecent: recent.length > 0,
      simulate: function () { var add = []; var ids = ps.map(function (p) { return p.id; });
        for (var round = 0; round < 4; round++) { var sh = ids.slice().sort(function () { return Math.random() - 0.5; });
          for (var i = 0; i + 1 < sh.length; i += 2) { var lo = Math.floor(Math.random() * SET); add.push(Math.random() < 0.5 ? { a: sh[i], b: sh[i + 1], sa: SET, sb: lo, t: Date.now() } : { a: sh[i], b: sh[i + 1], sa: lo, sb: SET, t: Date.now() }); } }
        self.save(s.res.concat(add)); },
      clear: function () { self.save(s.res.filter(function (r) { return !byId[r.a]; })); },
      divTabs: [['men', 'Men’s'], ['women', 'Women’s']].map(function (d) { return { label: d[1], on: s.div === d[0], off: s.div !== d[0], pick: function () { self.setState({ div: d[0], all: false, msg: '' }); } }; }),
      seatOpts: [32, 64].map(function (v) { return { label: 'Round of ' + v, on: s.seats === v, off: s.seats !== v, pick: function () { self.setState({ seats: v }); } }; }),
      wcOpts: [2, 4, 8].map(function (v) { return { label: v + ' seats', on: s.wc === v, off: s.wc !== v, pick: function () { self.setState({ wc: v }); } }; })
    };
  }
}


mountDC(Component);
</script>
