        <p style="margin:0 0 20px;font-size:16px;line-height:1.6;color:#dbe7ec">It is our way of saying thank you to the players who stayed dedicated throughout the league season, and a chance to compete for an attractive cash prize during the festive season, making Christmas even more rewarding.</p>
