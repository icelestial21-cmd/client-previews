<script>

class Component extends DCLogic {
  constructor(p){ super(p); this.state = { type: 'All' }; }
  renderVals() {
    const ty = this.state.type;
    const types = ['All', 'Leagues', 'Tournaments'].map((l) => ({ label: l, on: l === ty, off: l !== ty, pick: () => this.setState({ type: l }) }));
    return { types: types, showDomino: ty !== 'Tournaments', showExisting: ty !== 'Tournaments', showEmpty: ty === 'Tournaments' };
  }
}

mountDC(Component);
</script>
