    <a href="index.html" style="display:flex;align-items:center;gap:10px;color:#ffffff"><span style="width:40px;height:40px;border-radius:10px;background:#1d5a72;border:1px solid #3a7590;display:flex;align-items:center;justify-content:center;font:400 16px 'Bebas Neue',sans-serif;color:#FCAE40">CSQ</span><span style="font:400 24px 'Bebas Neue',sans-serif;letter-spacing:.03em">CARIBBEAN SPORTS QUEST</span></a>

<div style="background:#F7F8F8;border-bottom:1px solid #DAE3E6;font-family:Inter,sans-serif"><div style="max-width:1320px;margin:0 auto;padding:10px 24px;font-size:13px;display:flex;gap:8px;flex-wrap:wrap"><a href="#" style="color:#4C6874">Home</a> <span style="color:#4C6874">›</span> <a href="index.html" style="color:#4C6874">Leagues &amp; Tournaments</a> <span style="color:#4C6874">›</span> <span style="color:#14485D;font-weight:500">Christmas Domino League</span></div></div>

  <div style="border-bottom:1px solid #DAE3E6;background:#E8ECED;margin-top:0">
    <div style="max-width:1320px;margin:0 auto;padding:12px 24px;display:flex;gap:10px;overflow-x:auto">
      <sc-for list="{{fixtures}}" as="f" hint-placeholder-count="7">
        <div style="flex:0 0 180px;background:#ffffff;border:1px solid #DAE3E6;border-radius:8px;padding:10px 12px">
          <div style="font:700 11px Inter,sans-serif;letter-spacing:.08em;color:{{rubric}}">{{f.d}} {{f.dt}} · 7:45 PM</div>
          <div style="font-size:13px;font-weight:600;margin-top:6px">{{f.a}}</div>
          <div style="font-size:13px;font-weight:600">{{f.b}}</div>
        </div>
      </sc-for>
    </div>
  </div>


  <section aria-label="Division" style="position:sticky;top:0;z-index:20;background:#ffffff;border-bottom:1px solid #DAE3E6">
    <div style="max-width:1320px;margin:0 auto;padding:10px 24px;display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between">
      <div style="font:600 12px Inter,sans-serif;letter-spacing:.1em;color:#4C6874">DIVISION · <span style="color:#14485D">{{divName}}</span></div>
      <div role="group" aria-label="Choose division" style="display:flex;gap:6px;flex-wrap:wrap">
        <sc-for list="{{divs}}" as="d" hint-placeholder-count="2">
          <sc-if value="{{d.on}}" hint-placeholder-val="{{false}}"><button onClick="{{d.pick}}" aria-pressed="true" style="min-height:44px;padding:0 18px;border-radius:999px;border:2px solid #14485D;background:#14485D;color:#ffffff;font:700 14px Inter,sans-serif;cursor:pointer">{{d.label}} <span style="font-weight:500;opacity:.85">· {{d.cap}}</span></button></sc-if>
          <sc-if value="{{d.off}}" hint-placeholder-val="{{true}}"><button onClick="{{d.pick}}" aria-pressed="false" style="min-height:44px;padding:0 18px;border-radius:999px;border:2px solid #DAE3E6;background:transparent;color:#14485D;font:600 14px Inter,sans-serif;cursor:pointer">{{d.label}} <span style="font-weight:500;opacity:.85">· {{d.cap}}</span></button></sc-if>
        </sc-for>
      </div>
    </div>
  </section>

  <section style="max-width:1320px;margin:0 auto;padding:36px 24px 0;display:flex;flex-wrap:wrap;gap:40px">
    <div style="flex:1 1 560px;min-width:0">
      <div style="font:700 12px Inter,sans-serif;letter-spacing:.12em;color:{{rubric}}">DOMINO · LEAGUE · UPCOMING</div>
      <h1 class="disp" style="margin:10px 0 0;font-size:clamp(48px,10vw,84px);line-height:.92">2nd Annual Christmas Domino League</h1>
      <p style="margin:16px 0 0;font-size:19px;line-height:1.55;color:#2c5566;max-width:620px">A thank-you to the players who carried the JDCA League. Fourteen teams play a first round of team matches from November 30 to December 10, then the knockout rounds lead to the final and closing ceremony on Wednesday, December 23.</p>
      <div style="margin-top:18px;padding:16px;border:1px solid #DAE3E6;border-radius:14px;background:#ffffff">
        <div style="display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;margin-bottom:10px"><span style="font:700 12px Inter,sans-serif;letter-spacing:.12em;color:{{rubric}}">RULES AT A GLANCE</span><button onClick="{{rules.openAll}}" style="min-height:40px;padding:0 16px;border-radius:999px;border:0;background:#14485D;color:#ffffff;font:700 13px Inter,sans-serif;cursor:pointer">Full rules</button></div>
        <div style="display:flex;flex-wrap:wrap;gap:8px">
          <sc-for list="{{glance}}" as="g" hint-placeholder-count="6"><button class="lift" onClick="{{g.pick}}" style="min-height:40px;padding:0 14px;border-radius:999px;border:1px solid #DAE3E6;background:#F7F8F8;color:#14485D;font:600 13px Inter,sans-serif;cursor:pointer">{{g.label}} ›</button></sc-for>
        </div>
      </div>

      <h2 id="fixtures" class="disp" style="margin:40px 0 12px;font-size:36px">First round</h2>
      <p style="margin:-4px 0 12px;font-size:14px;color:#4C6874">Team matches. Matches begin at 7:45 PM and must start by 8:00 PM sharp.</p>
      <div style="overflow-x:auto;border-top:2px solid #14485D">
        <div style="min-width:640px">
          <div style="display:grid;grid-template-columns:110px minmax(0,1.4fr) minmax(0,1fr) 70px;gap:12px;padding:10px 4px;font:600 12px Inter,sans-serif;letter-spacing:.06em;color:#4C6874;border-bottom:1px solid #DAE3E6">
            <span>DATE</span><span>MATCH</span><span>VENUE</span><span>TIME</span>
          </div>
          <sc-for list="{{fixtures}}" as="f" hint-placeholder-count="7">
            <div style="display:grid;grid-template-columns:110px minmax(0,1.4fr) minmax(0,1fr) 70px;gap:12px;padding:14px 4px;border-bottom:1px solid #DAE3E6;align-items:center;font-size:15px">
              <span style="font-weight:600">{{f.d}} {{f.dt}}</span>
              <span><strong>{{f.a}}</strong> <span style="color:#4C6874">vs</span> <strong>{{f.b}}</strong></span>
              <span>{{f.v}}<br><span style="font-size:13px;color:#4C6874">{{f.ad}}</span></span>
              <span>7:45 PM</span>
            </div>
          </sc-for>
        </div>
      </div>

      <h2 class="disp" style="margin:40px 0 4px;font-size:36px">Knockout rounds</h2>
      <p style="margin:0 0 12px;font-size:14px;color:#4C6874">Second round on 8 tables, then the men’s and women’s knockouts at Mystix Sports Club.</p>
      <div style="overflow-x:auto;border-top:2px solid #14485D">
        <div style="min-width:600px">
          <div style="display:grid;grid-template-columns:110px minmax(0,1.2fr) minmax(0,1.2fr);gap:12px;padding:10px 4px;font:600 12px Inter,sans-serif;letter-spacing:.06em;color:#4C6874;border-bottom:1px solid #DAE3E6"><span>DATE</span><span>ROUND</span><span>VENUE</span></div>
          <sc-for list="{{knock}}" as="k" hint-placeholder-count="7">
            <div style="display:grid;grid-template-columns:110px minmax(0,1.2fr) minmax(0,1.2fr);gap:12px;padding:14px 4px;border-bottom:1px solid #DAE3E6;align-items:center;font-size:15px">
              <span style="font-weight:600">{{k.d}} {{k.dt}}</span>
              <span><strong>{{k.stage}}</strong><br><span style="font-size:13px;color:#4C6874">{{k.detail}}</span></span>
              <span>{{k.v}}<br><span style="font-size:13px;color:#4C6874">{{k.ad}}</span></span>
            </div>
          </sc-for>
        </div>
      </div>
    </div>
    <aside style="flex:0 1 340px;min-width:260px;display:flex;flex-direction:column;gap:20px">

      <div style="border-top:2px solid #14485D;padding-top:12px">
        <div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><div class="disp" style="font-size:24px">Match-night rules</div><button onClick="{{rules.openAll}}" style="min-height:40px;padding:0 14px;border-radius:999px;border:1px solid #14485D;background:#ffffff;color:#14485D;font:700 13px Inter,sans-serif;cursor:pointer">All rules</button></div>
        <div style="display:grid;grid-template-columns:110px minmax(0,1fr);gap:8px 12px;margin-top:10px;font-size:14px">

          <span style="color:#4C6874">Grace period</span><span style="font-weight:600">15 min · begin by 8:00 PM sharp</span>
          <span style="color:#4C6874">Sets</span><span style="font-weight:600">Men to 15 · women to 11</span>
          <span style="color:#4C6874">Dress code</span><span style="font-weight:600">Enforced · belts must be worn</span>
          <span style="color:#4C6874">Eligibility</span><span style="font-weight:600">JDCA League teams only</span>
          <span style="color:#4C6874">Squads</span><span style="font-weight:600">9 men and 4 women</span>
          <span style="color:#4C6874">ID</span><span style="font-weight:600">Government ID required</span>
        </div>

  <section id="about" style="max-width:1320px;margin:0 auto;padding:48px 24px 0">
    <div style="border-top:2px solid #14485D;padding-top:20px;display:flex;flex-wrap:wrap;gap:40px">
      <div style="flex:1 1 520px;min-width:0">
        <div style="font:700 12px Inter,sans-serif;letter-spacing:.12em;color:{{rubric}}">ABOUT</div>
        <h2 class="disp" style="margin:6px 0 12px;font-size:44px;line-height:1">A thank-you to the JDCA League’s players</h2>
        <p style="margin:0 0 12px;font-size:17px;line-height:1.65;color:#2c5566">The Christmas Domino League was established as a gesture of appreciation to recognise and reward the players who participated in, and showed their commitment and support to, the JDCA League.</p>
        <p style="margin:0 0 12px;font-size:17px;line-height:1.65;color:#2c5566">It is our way of saying thank you to the players who stayed dedicated throughout the league season, and a chance to compete for an attractive cash prize during the festive season, making Christmas even more rewarding.</p>
        <p style="margin:0 0 12px;font-size:17px;line-height:1.65;color:#2c5566">The Christmas Domino League is more than just another competition. It is an opportunity to celebrate commitment, sportsmanship and the players who helped make the JDCA League a success.</p>
        <p style="margin:0;font-size:19px;font-weight:700">You supported the league. Now it’s our turn to reward you!</p>
      </div>
      <div style="flex:1 1 360px;min-width:0;background:#E8ECED;border-radius:8px;padding:20px 24px">
        <div class="disp" style="font-size:26px">Participation criteria</div>
        <ol style="margin:8px 0 0;padding-left:20px;font-size:15px;line-height:1.55"><li style="padding:8px 0">Only teams that participated in the JDCA League are eligible.</li><li style="padding:8px 0">Each eligible team submits a list of a maximum of nine (9) male players and four (4) female players.</li><li style="padding:8px 0">Players selected must have demonstrated commitment and devoted attention to the JDCA League.</li><li style="padding:8px 0">Players must not have participated in any other domino league of a similar nature, in keeping with the participation conditions set at the start of the JDCA League.</li></ol>
      </div>
    </div>
  </section>

  <section id="teams" style="max-width:1320px;margin:0 auto;padding:48px 24px 72px">
    <h2 class="disp" style="margin:0 0 4px;font-size:36px">{{divShort}} teams</h2>
    <p style="margin:0 0 16px;font-size:15px;color:#4C6874">Choose a team to view its roster. <a href="players.html" style="font-weight:700;color:#CC1F19;text-decoration:underline">Browse all players →</a> · <a href="teams.html" style="font-weight:700;color:#CC1F19;text-decoration:underline">All teams →</a> · <a href="standings.html" style="font-weight:700;color:#CC1F19;text-decoration:underline">Standings →</a></p>
    <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:0;border-top:2px solid #14485D">
      <sc-for list="{{teams}}" as="t" hint-placeholder-count="14">
        <sc-if value="{{t.active}}" hint-placeholder-val="{{false}}">
          <button onClick="{{t.pick}}" style="display:flex;gap:12px;align-items:center;min-height:64px;padding:10px 8px;border:0;border-bottom:1px solid #DAE3E6;background:#E8ECED;text-align:left;cursor:pointer;font:inherit;color:#14485D">
            <span style="width:40px;height:40px;border-radius:50%;background:{{rubric}};color:#ffffff;display:flex;align-items:center;justify-content:center;font:700 13px Inter,sans-serif">{{t.ini}}</span>
            <span><span style="display:block;font-weight:700;font-size:15px">{{t.n}}</span><span style="font-size:12px;color:#4C6874">{{t.count}}</span></span>
          </button>
        </sc-if>
        <sc-if value="{{t.idle}}" hint-placeholder-val="{{true}}">
          <button onClick="{{t.pick}}" style="display:flex;gap:12px;align-items:center;min-height:64px;padding:10px 8px;border:0;border-bottom:1px solid #DAE3E6;background:#ffffff;text-align:left;cursor:pointer;font:inherit;color:#14485D">
            <span style="width:40px;height:40px;border-radius:50%;background:#14485D;color:#ffffff;display:flex;align-items:center;justify-content:center;font:700 13px Inter,sans-serif">{{t.ini}}</span>
            <span><span style="display:block;font-weight:600;font-size:15px">{{t.n}}</span><span style="font-size:12px;color:#4C6874">{{t.count}}</span></span>
          </button>
        </sc-if>
      </sc-for>
    </div>
    <div style="margin-top:28px;border:1px solid #DAE3E6;border-radius:8px;padding:24px">
      <div style="display:flex;flex-wrap:wrap;gap:8px 20px;align-items:baseline">
        <div class="disp" style="font-size:44px;line-height:1">{{sel.n}}</div>
        <a href="teams.html?t={{sel.i}}" style="display:inline-flex;align-items:center;min-height:44px;font:700 14px Inter,sans-serif;color:#CC1F19;text-decoration:underline">Team schedule &amp; follow →</a>
        <div style="font-size:14px;color:#4C6874">{{sel.vs}}</div>
      </div>
      <div style="display:flex;flex-wrap:wrap;gap:32px;margin-top:16px">
        <div style="flex:2 1 400px;min-width:0">
          <div style="font:700 12px Inter,sans-serif;letter-spacing:.1em;color:{{rubric}};border-bottom:1px solid #14485D;padding-bottom:6px">{{sel.label}} ({{sel.lc}})</div>
          <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));column-gap:24px">
            <sc-for list="{{sel.list}}" as="p" hint-placeholder-count="9"><div style="padding:9px 0;border-bottom:1px solid #DAE3E6;font-size:14px">{{p}}</div></sc-for>
          </div>
          <sc-if value="{{sel.none}}" hint-placeholder-val="{{false}}"><div style="padding:9px 0;font-size:14px;color:#4C6874">{{sel.noneMsg}}</div></sc-if>
        </div>
      </div>
    </div>
  </section>
<footer style="background:#14485D;color:#ffffff;font-family:Inter,sans-serif">

    <div><div style="font:400 22px 'Bebas Neue',sans-serif;letter-spacing:.03em">CARIBBEAN SPORTS QUEST</div><div style="font-size:14px;color:#dbe7ec;margin-top:6px">Your Caribbean Sports Home</div></div>
    <div><div style="font:400 18px 'Bebas Neue',sans-serif;color:#FCAE40;letter-spacing:.04em">Follow us</div><div style="font-size:14px;color:#dbe7ec;margin-top:8px;line-height:1.9">Instagram<br>TikTok</div></div>
    <div><div style="font:400 18px 'Bebas Neue',sans-serif;color:#FCAE40;letter-spacing:.04em">Contact</div><div style="font-size:14px;color:#dbe7ec;margin-top:8px;line-height:1.9">support@caribbeansportsquest.com<br>Sell with CSQ: become a partner shop</div></div>
  </div>

<sc-if value="{{rules.open}}" hint-placeholder-val="{{false}}">
  <div onClick="{{rules.close}}" style="position:fixed;inset:0;z-index:200;background:rgba(7,28,37,.75);display:flex;align-items:center;justify-content:center;padding:16px;font-family:Inter,sans-serif">
