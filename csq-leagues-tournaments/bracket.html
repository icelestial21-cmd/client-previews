<script>

var SIZE = 32; /* set to 64 when the draw grows to a Round of 64 */
class Component extends DCLogic {
  constructor(p) {
    super(p);
    var d = 'men'; try { if (new URLSearchParams(location.search).get('div') === 'women') d = 'women'; } catch (e) {}
    var em = !!this.props.embed; try { if (new URLSearchParams(location.search).get('embed') === '1') em = true; } catch (e) {}
    this.embed = em; this.state = { rot: 0, sel: null, div: d };
    this.drag = null; this.live = 0;
  }

    for (var l = 1; l <= L; l++) { ang[l] = []; for (var j = 0; j < N >> l; j++) ang[l].push((ang[l - 1][2 * j] + ang[l - 1][2 * j + 1]) / 2); }

    var allOn = s.sel === 'final';
    var HI = '#FCAE40', LO = '#4f8aa3';
    var segs = [], dots = [];
    var arc = function (r, a1, a2) { var p1 = pt(r, a1), p2 = pt(r, a2); var sw = a2 > a1 ? 1 : 0; return 'M' + p1[0] + ' ' + p1[1] + ' A' + r + ' ' + r + ' 0 0 ' + sw + ' ' + p2[0] + ' ' + p2[1]; };
    for (var l2 = 1; l2 <= L; l2++) {
      for (var j2 = 0; j2 < N >> l2; j2++) {
        var pa = ang[l2][j2];
        [2 * j2, 2 * j2 + 1].forEach(function (c) {

          }

        try { var g = document.getElementById('spin'); if (g) g.classList.add('dragging'); } catch (x) {} },
      move: function (e) { var d = self.drag; if (!d) return; var a = Math.atan2(e.clientY - d.cy, e.clientX - d.cx) * 180 / Math.PI; var delta = a - d.a0;

        if (d.moved) self.setRot(d.r0 + delta); },
      up: function () { var d = self.drag; self.drag = null; try { var g = document.getElementById('spin'); if (g) g.classList.remove('dragging'); } catch (x) {} if (d && d.moved) self.setState({ rot: self.live }); }
    };
  }
}
