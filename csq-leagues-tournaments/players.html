</style>

<div style="background:#F7F8F8;color:#14485D;font-family:Inter,sans-serif;min-height:100vh">
<header style="background:#14485D;color:#ffffff;font-family:Inter,sans-serif">
  <div style="max-width:1320px;margin:0 auto;padding:12px 24px;display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between">
    <a href="index.html" style="display:flex;align-items:center;gap:10px;color:#ffffff"><span style="width:40px;height:40px;border-radius:10px;background:#1d5a72;border:1px solid #3a7590;display:flex;align-items:center;justify-content:center;font:400 16px 'Bebas Neue',sans-serif;color:#FCAE40">CSQ</span><span style="font:400 24px 'Bebas Neue',sans-serif;letter-spacing:.03em">CARIBBEAN SPORTS QUEST</span></a>
    <nav aria-label="Main" style="display:flex;flex-wrap:wrap;gap:4px;align-items:center;font:500 15px Inter,sans-serif">

<div style="background:#F7F8F8;border-bottom:1px solid #DAE3E6;font-family:Inter,sans-serif"><div style="max-width:1320px;margin:0 auto;padding:10px 24px;font-size:13px;display:flex;gap:8px;flex-wrap:wrap"><a href="#" style="color:#4C6874">Home</a> <span style="color:#4C6874">›</span> <a href="index.html" style="color:#4C6874">Leagues &amp; Tournaments</a> <span style="color:#4C6874">›</span> <a href="option-a.html" style="color:#4C6874">Christmas Domino League</a> <span style="color:#4C6874">›</span> <span style="color:#14485D;font-weight:500">Players</span></div></div>
<sc-if value="{{board}}" hint-placeholder-val="{{true}}">
<section class="pips" style="background-color:#14485D;color:#ffffff">
  <div style="max-width:1320px;margin:0 auto;padding:36px 24px 30px;display:flex;flex-wrap:wrap;gap:16px;align-items:flex-end;justify-content:space-between">
    <div>
      <div style="font:700 12px Inter,sans-serif;letter-spacing:.12em;color:#FCAE40">2ND ANNUAL CHRISTMAS DOMINO LEAGUE</div>
      <h1 class="disp" style="margin:6px 0 0;font-size:clamp(52px,9vw,80px);line-height:.9">Players</h1>
      <p style="margin:10px 0 0;font-size:17px;color:#dbe7ec;max-width:620px">Every registered player, by team and division. Tap a player to open their profile.</p>
    </div>
    <div style="display:flex;gap:28px">
      <div><div class="disp" style="font-size:44px;line-height:1">{{totals.all}}</div><div style="font-size:13px;color:#b9cfd8">Players</div></div>
      <div><div class="disp" style="font-size:44px;line-height:1">{{totals.men}}</div><div style="font-size:13px;color:#b9cfd8">Men</div></div>
      <div><div class="disp" style="font-size:44px;line-height:1">{{totals.women}}</div><div style="font-size:13px;color:#b9cfd8">Women</div></div>
    </div>

</section>

<section style="max-width:1320px;margin:0 auto;padding:24px 24px 0">
  <div style="background:#ffffff;border:1px solid #DAE3E6;border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:14px">
    <div style="display:flex;flex-wrap:wrap;gap:12px;align-items:center">
      <label style="flex:1 1 320px;min-height:46px;display:flex;align-items:center;gap:10px;padding:0 14px;border:1px solid #DAE3E6;border-radius:10px;background:#F7F8F8">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#4C6874" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <span style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Search players</span>
        <input id="playerSearch" type="search" value="{{q}}" onInput="{{onSearch}}" placeholder="Search by name, nickname or team" autocomplete="off" style="border:0;outline:0;flex:1;min-width:0;font:15px Inter,sans-serif;background:transparent;color:#14485D">
      </label>
      <div role="group" aria-label="Division" style="display:flex;background:#E8ECED;border-radius:10px;padding:4px;gap:4px">
        <sc-for list="{{divTabs}}" as="d" hint-placeholder-count="3">
          <sc-if value="{{d.on}}" hint-placeholder-val="{{false}}"><button onClick="{{d.pick}}" aria-pressed="true" style="min-height:38px;padding:0 16px;border:0;border-radius:8px;background:#14485D;color:#ffffff;font:600 14px Inter,sans-serif;cursor:pointer">{{d.label}}</button></sc-if>
          <sc-if value="{{d.off}}" hint-placeholder-val="{{true}}"><button onClick="{{d.pick}}" aria-pressed="false" style="min-height:38px;padding:0 16px;border:0;border-radius:8px;background:transparent;color:#14485D;font:500 14px Inter,sans-serif;cursor:pointer">{{d.label}}</button></sc-if>
        </sc-for>
      </div>
    </div>
    <div role="group" aria-label="Team" style="display:flex;flex-wrap:wrap;gap:8px">
      <sc-for list="{{teamChips}}" as="c" hint-placeholder-count="15">
        <sc-if value="{{c.on}}" hint-placeholder-val="{{false}}"><button onClick="{{c.pick}}" aria-pressed="true" style="min-height:36px;padding:0 14px;border-radius:999px;border:1px solid #14485D;background:#14485D;color:#ffffff;font:600 13px Inter,sans-serif;cursor:pointer">{{c.label}}</button></sc-if>
        <sc-if value="{{c.off}}" hint-placeholder-val="{{true}}"><button onClick="{{c.pick}}" aria-pressed="false" style="min-height:36px;padding:0 14px;border-radius:999px;border:1px solid #DAE3E6;background:#ffffff;color:#14485D;font:500 13px Inter,sans-serif;cursor:pointer">{{c.label}}</button></sc-if>
      </sc-for>
    </div>
  </div>

  <div id="resultsTop" style="display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin:20px 0 14px;scroll-margin-top:16px">
    <p aria-live="polite" style="margin:0;font-size:15px;color:#4C6874"><strong class="disp" style="font-size:26px;color:#14485D">{{count}}</strong> {{noun}}<sc-if value="{{paged}}" hint-placeholder-val="{{true}}"> · showing {{range}}</sc-if></p>
    <div role="group" aria-label="Layout" style="display:flex;background:#E8ECED;border-radius:10px;padding:4px;gap:4px">
      <sc-for list="{{layouts}}" as="l" hint-placeholder-count="2">
        <sc-if value="{{l.on}}" hint-placeholder-val="{{false}}"><button onClick="{{l.pick}}" aria-pressed="true" style="min-height:38px;padding:0 16px;border:0;border-radius:8px;background:#ffffff;color:#14485D;font:600 14px Inter,sans-serif;cursor:pointer;box-shadow:0 1px 2px rgba(20,72,93,.15)">{{l.label}}</button></sc-if>
        <sc-if value="{{l.off}}" hint-placeholder-val="{{true}}"><button onClick="{{l.pick}}" aria-pressed="false" style="min-height:38px;padding:0 16px;border:0;border-radius:8px;background:transparent;color:#4C6874;font:500 14px Inter,sans-serif;cursor:pointer">{{l.label}}</button></sc-if>
      </sc-for>
    </div>
  </div>

  <sc-if value="{{empty}}" hint-placeholder-val="{{false}}">
    <div style="border:2px dashed #DAE3E6;border-radius:16px;padding:40px;text-align:center;color:#4C6874">No players match. <button onClick="{{clearAll}}" style="border:0;background:none;color:#CC1F19;font:700 15px Inter,sans-serif;cursor:pointer">Clear filters</button></div>
  </sc-if>

  <sc-if value="{{cards}}" hint-placeholder-val="{{true}}">
    <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(min(250px,100%),1fr));gap:14px">
      <sc-for list="{{shown}}" as="p" hint-placeholder-count="12">
        <button class="lift" onClick="{{p.open}}" style="text-align:left;background:#ffffff;border:1px solid #DAE3E6;border-radius:16px;padding:0;overflow:hidden;cursor:pointer;font:inherit;color:#14485D;display:flex;flex-direction:column">
          <div class="pips" style="height:96px;background-color:{{p.band}};position:relative">
            <span style="position:absolute;left:16px;bottom:-26px;width:64px;height:64px;border-radius:50%;background:#ffffff;border:3px solid #ffffff;box-shadow:0 2px 8px rgba(20,72,93,.2);display:flex;align-items:center;justify-content:center"><span class="disp" style="width:58px;height:58px;border-radius:50%;background:#E8ECED;display:flex;align-items:center;justify-content:center;font-size:26px;color:#14485D">{{p.ini}}</span></span>
            <span style="position:absolute;right:12px;top:12px;background:rgba(255,255,255,.92);color:#14485D;font:700 11px Inter,sans-serif;letter-spacing:.06em;padding:4px 8px;border-radius:6px">{{p.divShort}}</span>
            <sc-if value="{{p.followed}}" hint-placeholder-val="{{false}}"><span style="position:absolute;left:12px;top:12px;background:#FCAE40;color:#0e3546;font:700 11px Inter,sans-serif;letter-spacing:.04em;padding:4px 8px;border-radius:6px">★ FOLLOWING</span></sc-if>
          </div>
          <div style="padding:34px 16px 16px;display:flex;flex-direction:column;gap:4px">
            <span class="disp" style="font-size:26px;line-height:1">{{p.name}}</span>
            <span style="font-size:14px;color:#CC1F19;font-weight:600;min-height:18px">{{p.nickLine}}</span>
            <span style="font-size:14px;color:#4C6874">{{p.team}}</span>
            <span style="margin-top:8px;padding-top:10px;border-top:1px solid #E8ECED;font-size:12px;color:#4C6874">First round · {{p.fxShort}}</span>
          </div>
        </button>
      </sc-for>
    </div>
  </sc-if>

  <sc-if value="{{table}}" hint-placeholder-val="{{false}}">
    <div style="overflow-x:auto;background:#ffffff;border:1px solid #DAE3E6;border-radius:16px">
      <div style="min-width:760px">
        <div style="display:grid;grid-template-columns:48px minmax(0,1.4fr) minmax(0,1fr) minmax(0,1.1fr) 90px minmax(0,1.4fr);gap:12px;padding:12px 16px;font:600 12px Inter,sans-serif;letter-spacing:.06em;color:#4C6874;border-bottom:1px solid #DAE3E6"><span>#</span><span>PLAYER</span><span>NICKNAME</span><span>TEAM</span><span>DIVISION</span><span>FIRST ROUND</span></div>
        <sc-for list="{{shown}}" as="p" hint-placeholder-count="12">
          <button onClick="{{p.open}}" style="width:100%;display:grid;grid-template-columns:48px minmax(0,1.4fr) minmax(0,1fr) minmax(0,1.1fr) 90px minmax(0,1.4fr);gap:12px;padding:12px 16px;border:0;border-bottom:1px solid #E8ECED;background:#ffffff;text-align:left;font:14px Inter,sans-serif;color:#14485D;cursor:pointer;align-items:center">
            <span style="color:#4C6874">{{p.no}}</span><strong>{{p.name}}</strong><span style="color:#CC1F19">{{p.nick}}</span><span>{{p.team}}</span><span>{{p.divShort}}</span><span style="color:#4C6874">{{p.fxShort}}</span>
          </button>
        </sc-for>
      </div>
    </div>
  </sc-if>
  <sc-if value="{{paged}}" hint-placeholder-val="{{true}}">
    <nav aria-label="Pages" style="display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;margin:28px 0 0">
      <sc-if value="{{hasPrev}}" hint-placeholder-val="{{false}}"><button onClick="{{prevPage}}" style="min-height:44px;padding:0 16px;border-radius:999px;border:1px solid #DAE3E6;background:#ffffff;color:#14485D;font:600 14px Inter,sans-serif;cursor:pointer">← Previous</button></sc-if>
      <sc-if value="{{noPrev}}" hint-placeholder-val="{{true}}"><button disabled style="min-height:44px;padding:0 16px;border-radius:999px;border:1px solid #E8ECED;background:#F7F8F8;color:#8aa0aa;font:600 14px Inter,sans-serif">← Previous</button></sc-if>
      <sc-for list="{{pageBtns}}" as="b" hint-placeholder-count="6">
        <sc-if value="{{b.on}}" hint-placeholder-val="{{false}}"><button onClick="{{b.pick}}" aria-current="page" aria-label="Page {{b.label}}" style="min-width:44px;min-height:44px;border-radius:999px;border:0;background:#14485D;color:#ffffff;font:700 15px Inter,sans-serif;cursor:pointer">{{b.label}}</button></sc-if>
        <sc-if value="{{b.off}}" hint-placeholder-val="{{true}}"><button onClick="{{b.pick}}" aria-label="Page {{b.label}}" style="min-width:44px;min-height:44px;border-radius:999px;border:1px solid #DAE3E6;background:#ffffff;color:#14485D;font:600 15px Inter,sans-serif;cursor:pointer">{{b.label}}</button></sc-if>
      </sc-for>
      <sc-if value="{{hasNext}}" hint-placeholder-val="{{true}}"><button onClick="{{nextPage}}" style="min-height:44px;padding:0 16px;border-radius:999px;border:1px solid #14485D;background:#14485D;color:#ffffff;font:600 14px Inter,sans-serif;cursor:pointer">Next →</button></sc-if>
      <sc-if value="{{noNext}}" hint-placeholder-val="{{false}}"><button disabled style="min-height:44px;padding:0 16px;border-radius:999px;border:1px solid #E8ECED;background:#F7F8F8;color:#8aa0aa;font:600 14px Inter,sans-serif">Next →</button></sc-if>
    </nav>
  </sc-if>
  <div style="height:64px"></div>
</section>
</sc-if>

<sc-if value="{{profile}}" hint-placeholder-val="{{false}}">
<section style="max-width:1320px;margin:0 auto;padding:16px 24px 0">
  <button onClick="{{back}}" style="min-height:44px;padding:0 4px;border:0;background:none;color:#14485D;font:600 14px Inter,sans-serif;cursor:pointer">← All players</button>
</section>
<section style="max-width:1320px;margin:0 auto;padding:8px 24px 0">
  <div class="pips" style="background-color:#14485D;color:#ffffff;border-radius:20px;overflow:hidden">
    <div style="height:10px;background:linear-gradient(90deg,#FCAE40 0 25%,#CC1F19 25% 50%,#ffffff 50% 75%,#1d5a72 75%)"></div>
    <div style="padding:28px;display:flex;flex-wrap:wrap;gap:28px;align-items:center">
      <div style="flex:0 0 auto;width:150px;height:150px;border-radius:24px;background:#1d5a72;border:2px solid #3a7590;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px">
        <span class="disp" style="font-size:64px;line-height:1;color:#FCAE40">{{pl.ini}}</span>
        <span style="font-size:11px;color:#b9cfd8">Photo to come</span>
      </div>
      <div style="flex:1 1 320px;min-width:0">
        <div style="display:flex;flex-wrap:wrap;gap:8px;font:700 12px Inter,sans-serif;letter-spacing:.06em">
          <span style="background:#FCAE40;color:#0e3546;padding:5px 10px;border-radius:6px">{{pl.divName}}</span>
          <a href="teams.html?t={{pl.ti}}" style="border:1px solid #3a7590;padding:4px 10px;border-radius:6px;color:#ffffff">{{pl.team}} →</a>
          <sc-if value="{{pl.hasNote}}" hint-placeholder-val="{{false}}"><span style="background:#CC1F19;padding:5px 10px;border-radius:6px">{{pl.note}}</span></sc-if>
        </div>
        <h1 class="disp" style="margin:12px 0 0;font-size:clamp(48px,8vw,72px);line-height:.92">{{pl.name}}</h1>
        <p style="margin:6px 0 0;font-size:20px;color:#FCAE40;font-weight:600;min-height:4px">{{pl.nickLine}}</p>
        <div style="margin-top:14px">
          <sc-if value="{{pl.followed}}" hint-placeholder-val="{{false}}"><button class="follow {{pl.popCls}}" onClick="{{pl.toggle}}" aria-pressed="true" style="min-height:48px;padding:0 22px;border-radius:999px;border:2px solid #FCAE40;background:#FCAE40;color:#0e3546;font:700 15px Inter,sans-serif;cursor:pointer">★ Following</button></sc-if>
          <sc-if value="{{pl.notFollowed}}" hint-placeholder-val="{{true}}"><button class="follow" onClick="{{pl.toggle}}" aria-pressed="false" style="min-height:48px;padding:0 22px;border-radius:999px;border:2px solid #ffffff;background:transparent;color:#ffffff;font:700 15px Inter,sans-serif;cursor:pointer">☆ Follow player</button></sc-if>
        </div>
      </div>
      <dl style="flex:1 1 300px;min-width:0;margin:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 20px">
        <div><dt style="font-size:12px;color:#b9cfd8;letter-spacing:.06em">TEAM</dt><dd style="margin:2px 0 0;font-weight:600">{{pl.team}}</dd></div>
        <div><dt style="font-size:12px;color:#b9cfd8;letter-spacing:.06em">DIVISION</dt><dd style="margin:2px 0 0;font-weight:600">{{pl.divName}}</dd></div>
        <div><dt style="font-size:12px;color:#b9cfd8;letter-spacing:.06em">SQUAD</dt><dd style="margin:2px 0 0;font-weight:600">{{pl.squad}}</dd></div>
        <div><dt style="font-size:12px;color:#b9cfd8;letter-spacing:.06em">FIRST MATCH</dt><dd style="margin:2px 0 0;font-weight:600">{{pl.fxDate}}</dd></div>
      </dl>
    </div>
  </div>
</section>

<section style="max-width:1320px;margin:0 auto;padding:20px 24px 64px;display:flex;flex-wrap:wrap;gap:20px;align-items:flex-start">
  <div style="flex:2 1 520px;min-width:0;display:flex;flex-direction:column;gap:20px">
    <div style="background:#ffffff;border:1px solid #DAE3E6;border-radius:16px;padding:22px">
